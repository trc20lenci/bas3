name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest 2>&1 | tee test.log

      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -hE "^e: |What went wrong|^> |error:|Execution failed|Could not " build.log test.log 2>/dev/null | head -60 | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
